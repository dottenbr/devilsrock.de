# Monthly update PRs, grouped so there is at most one PR per ecosystem.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      npm:
        patterns: ["*"]
    ignore:
      # Font Awesome 7 renames icons; upgrade deliberately, not via Dependabot
      - dependency-name: "@fortawesome/fontawesome-free"
        update-types: ["version-update:semver-major"]
