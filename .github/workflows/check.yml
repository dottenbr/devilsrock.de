name: Build and test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Type check
        run: npm run check
      - name: Build and verify dist/
        run: npm run build
      - name: Worker tests
        run: npm test
      - name: Check Worker syntax
        run: node --check worker/src/index.js
      - name: Validate Worker deployment (dry run)
        run: npx wrangler deploy --dry-run --config worker/wrangler.jsonc
